<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>سودوكو</title>
  <meta name="description" content="سودوكو بهدوء: لغز حر ولغز يومي، بخط واضح وشبكة ورق." />
  <meta name="theme-color" content="#1a1814" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3efe6;
      --sheet: #faf7f1;
      --ink: #1a1814;
      --muted: #6e675d;
      --line: #d9d2c5;
      --wash: #e6dfd1;
      --select: #ddd6c8;
      --danger: #8c3b32;
      --ok: #243f32;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans Arabic", sans-serif;
    }
    button { font: inherit; color: inherit; }
    button:not(:disabled) { cursor: pointer; }
    .desk {
      width: min(100%, 28rem);
      margin: 0 auto;
      padding: 0.85rem 0.9rem calc(1.5rem + env(safe-area-inset-bottom));
    }
    .mast {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--ink);
    }
    .kicker { margin: 0; color: var(--muted); font-size: 0.75rem; font-weight: 500; }
    h1 { margin: 0.1rem 0 0; font-size: 1.85rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
    .clock { font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 500; letter-spacing: -0.03em; text-align: left; }
    .best { margin-top: 0.25rem; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; text-align: left; }
    .install { margin: 0.75rem 0 0; }
    .install button, .win-actions button.solid {
      width: 100%;
      min-height: 2.9rem;
      border: 0;
      border-radius: 0.8rem;
      background: var(--ink);
      color: var(--sheet);
      font-weight: 600;
    }
    .switcher, .levels, .tools, .digits { display: flex; gap: 0.35rem; }
    .switcher { margin-top: 0.7rem; padding: 0.2rem; background: var(--wash); border-radius: 999px; }
    .switcher button, .levels button { flex: 1; border: 0; background: transparent; }
    .switcher button { min-height: 2.7rem; border-radius: 999px; font-weight: 500; }
    .switcher button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
    .levels { margin-top: 0.45rem; }
    .levels button { min-height: 2.4rem; color: var(--muted); border-bottom: 1px solid transparent; }
    .levels button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
    .levels button:disabled { opacity: 0.4; }
    .board-wrap { position: relative; margin-top: 0.7rem; }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      aspect-ratio: 1;
      direction: ltr;
      border: 2px solid var(--ink);
      background: var(--ink);
      gap: 1px;
    }
    .cell {
      display: flex; align-items: center; justify-content: center;
      border: 0; background: var(--sheet); padding: 0;
      font-size: clamp(1.05rem, 4.6vw, 1.55rem);
      font-weight: 500; font-variant-numeric: tabular-nums;
    }
    .cell.given { font-weight: 600; }
    .cell.peer { background: var(--paper); }
    .cell.same { background: var(--wash); }
    .cell.selected { background: var(--select); }
    .cell.conflict { color: var(--danger); }
    .cell.thick-r { box-shadow: inset -2px 0 0 var(--ink); }
    .cell.thick-b { box-shadow: inset 0 -2px 0 var(--ink); }
    .cell.thick-r.thick-b { box-shadow: inset -2px 0 0 var(--ink), inset 0 -2px 0 var(--ink); }
    .notes { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; color: var(--muted); font-size: clamp(0.48rem, 2vw, 0.68rem); }
    .notes span { display: flex; align-items: center; justify-content: center; }
    .digits { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.25rem; margin-top: 0.7rem; direction: ltr; }
    .digit {
      min-height: 2.6rem; background: var(--sheet); border: 1px solid var(--line);
      border-radius: 0.55rem; font-size: 1.15rem; font-weight: 500;
    }
    .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.5rem; }
    .tools.pair { grid-template-columns: 1fr 1fr; }
    .tool {
      min-height: 2.75rem; border: 1px solid var(--line); border-radius: 0.7rem;
      background: var(--sheet); color: var(--muted); font-size: 0.8rem; font-weight: 500;
    }
    .tool.on, .tool.primary { color: var(--ink); border-color: var(--ink); }
    .note { min-height: 1.3rem; margin: 0.55rem 0 0; text-align: center; font-weight: 500; }
    .note.ok { color: var(--ok); }
    .note.bad { color: var(--danger); }
    .veil {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: color-mix(in oklab, var(--paper) 82%, transparent); font-weight: 500;
    }
    .veil.show { display: flex; }
    .win {
      position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center;
      padding: 1rem; background: color-mix(in oklab, var(--ink) 28%, transparent);
    }
    .win.show { display: flex; }
    .win-card {
      width: min(100%, 24rem); margin-bottom: env(safe-area-inset-bottom);
      padding: 1.25rem; border-radius: 1.25rem; background: var(--sheet);
    }
    .win-card h2 { margin: 0; font-size: 1.45rem; }
    .win-card p { margin: 0.35rem 0 0; color: var(--muted); }
    .win-card .clock { margin-top: 0.7rem; font-size: 2rem; text-align: right; }
    .win-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .win-actions button { flex: 1; min-height: 2.8rem; border-radius: 0.8rem; border: 1px solid var(--ink); background: transparent; font-weight: 600; }
  </style>
</head>
<body>
  <main class="desk">
    <header class="mast">
      <div>
        <p class="kicker" id="date"></p>
        <h1>سودوكو</h1>
      </div>
      <div>
        <div class="clock" id="clock">00:00</div>
        <div class="best" id="best">لا وقت محفوظ</div>
      </div>
    </header>
    <section class="install" id="install">
      <button type="button" id="install-btn">تثبيت التطبيق على الجوال</button>
    </section>
    <div class="switcher">
      <button type="button" id="mode-free" aria-pressed="true">لغز حر</button>
      <button type="button" id="mode-daily" aria-pressed="false">لغز اليوم</button>
    </div>
    <div class="levels" id="levels"></div>
    <div class="board-wrap">
      <div class="board" id="board" role="grid"></div>
      <div class="veil" id="veil">يُجهَّز اللغز</div>
    </div>
    <div class="digits" id="digits"></div>
    <div class="tools">
      <button class="tool" id="notes" type="button">ملاحظات</button>
      <button class="tool" id="erase" type="button">مسح</button>
      <button class="tool" id="hint" type="button">تلميح 3</button>
      <button class="tool" id="check" type="button">تحقق</button>
    </div>
    <div class="tools pair">
      <button class="tool" id="pause" type="button">إيقاف</button>
      <button class="tool primary" id="again" type="button">لغز جديد</button>
    </div>
    <p class="note" id="status" role="status"></p>
  </main>
  <div class="win" id="win">
    <div class="win-card">
      <h2>تم الحل</h2>
      <p id="win-copy">لغز نظيف، بلا استعراض.</p>
      <div class="clock" id="win-time">00:00</div>
      <div class="win-actions">
        <button type="button" id="win-close">إغلاق</button>
        <button type="button" class="solid" id="win-next">لغز آخر</button>
      </div>
    </div>
  </div>
  <script>
    const LEVELS = [
      { id: "easy", label: "سهل", clues: 40 },
      { id: "mid", label: "متوسط", clues: 32 },
      { id: "hard", label: "صعب", clues: 28 },
      { id: "expert", label: "خبير", clues: 24 },
    ];
    const SAVE = "sudoku-desk-v1";
    const BEST = "sudoku-bests-v1";
    let deferredPrompt = null;
    let state = null;
    let timer = null;

    const $ = (id) => document.getElementById(id);
    const clock = (n) => {
      const s = Math.max(0, Math.floor(n));
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    };
    const daySeed = () => {
      const d = new Date();
      return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    };
    function rngOf(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function shuffle(items, rng) {
      const a = items.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function fits(g, i, v) {
      const r = Math.floor(i / 9), c = i % 9;
      for (let k = 0; k < 9; k++) if (g[r * 9 + k] === v || g[k * 9 + c] === v) return false;
      const br = r - (r % 3), bc = c - (c % 3);
      for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) if (g[(br + a) * 9 + bc + b] === v) return false;
      return true;
    }
    function fill(g, rng) {
      const i = g.indexOf(0);
      if (i < 0) return true;
      for (const v of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9], rng)) {
        if (!fits(g, i, v)) continue;
        g[i] = v;
        if (fill(g, rng)) return true;
        g[i] = 0;
      }
      return false;
    }
    function countSol(g, limit = 2) {
      let n = 0;
      const walk = () => {
        if (n >= limit) return;
        let best = -1, choices = null;
        for (let i = 0; i < 81; i++) {
          if (g[i]) continue;
          const opts = [];
          for (let v = 1; v <= 9; v++) if (fits(g, i, v)) opts.push(v);
          if (!opts.length) return;
          if (!choices || opts.length < choices.length) { choices = opts; best = i; if (opts.length === 1) break; }
        }
        if (best < 0) { n++; return; }
        for (const v of choices) { g[best] = v; walk(); g[best] = 0; if (n >= limit) return; }
      };
      walk();
      return n;
    }
    function generate(clues, rng) {
      const solution = Array(81).fill(0);
      fill(solution, rng);
      const puzzle = solution.slice();
      for (const i of shuffle([...Array(81).keys()], rng)) {
        if (puzzle.filter(Boolean).length <= clues) break;
        const prev = puzzle[i];
        puzzle[i] = 0;
        if (countSol(puzzle.slice()) !== 1) puzzle[i] = prev;
      }
      return { solution, puzzle };
    }
    function conflict(g, i) {
      const v = g[i];
      if (!v) return false;
      const r = Math.floor(i / 9), c = i % 9;
      for (let k = 0; k < 9; k++) {
        if (k !== c && g[r * 9 + k] === v) return true;
        if (k !== r && g[k * 9 + c] === v) return true;
      }
      const br = r - (r % 3), bc = c - (c % 3);
      for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {
        const j = (br + a) * 9 + bc + b;
        if (j !== i && g[j] === v) return true;
      }
      return false;
    }
    function peer(a, b) {
      if (a < 0 || b < 0 || a === b) return false;
      const ra = Math.floor(a / 9), ca = a % 9, rb = Math.floor(b / 9), cb = b % 9;
      return ra === rb || ca === cb || (ra - ra % 3 === rb - rb % 3 && ca - ca % 3 === cb - cb % 3);
    }
    function bests() {
      try { return JSON.parse(localStorage.getItem(BEST) || "{}"); } catch { return {}; }
    }
    function bestKey() {
      return state.mode === "daily" ? "daily-" + daySeed() : state.level;
    }
    function remember() {
      if (!state.done) return;
      const all = bests();
      const key = bestKey();
      if (all[key] == null || state.elapsed < all[key]) {
        all[key] = state.elapsed;
        localStorage.setItem(BEST, JSON.stringify(all));
      }
    }
    function fresh(mode, level) {
      const clues = mode === "daily" ? 30 : LEVELS.find((x) => x.id === level).clues;
      const rng = mode === "daily" ? rngOf(daySeed()) : Math.random;
      const { solution, puzzle } = generate(clues, rng);
      return {
        mode, level, solution, grid: puzzle.slice(),
        notes: Array.from({ length: 81 }, () => []),
        given: puzzle.map((v) => v !== 0),
        sel: -1, notesMode: false, elapsed: 0, running: true, done: false,
        hintsLeft: 3, message: "", tone: "",
      };
    }
    function persist() {
      localStorage.setItem(SAVE, JSON.stringify({ ...state, day: daySeed() }));
    }
    function render() {
      $("clock").textContent = clock(state.elapsed);
      const stored = bests()[bestKey()];
      $("best").textContent = stored != null ? "أفضل وقت " + clock(stored) : "لا وقت محفوظ";
      $("mode-free").setAttribute("aria-pressed", state.mode !== "daily");
      $("mode-daily").setAttribute("aria-pressed", state.mode === "daily");
      document.querySelectorAll("[data-level]").forEach((btn) => {
        btn.disabled = state.mode === "daily";
        btn.setAttribute("aria-pressed", state.mode !== "daily" && btn.dataset.level === state.level);
      });
      const selected = state.sel >= 0 ? state.grid[state.sel] : 0;
      $("board").innerHTML = "";
      for (let i = 0; i < 81; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell";
        const r = Math.floor(i / 9), c = i % 9;
        if (c === 2 || c === 5) btn.classList.add("thick-r");
        if (r === 2 || r === 5) btn.classList.add("thick-b");
        if (state.given[i] && state.grid[i]) btn.classList.add("given");
        if (state.sel === i) btn.classList.add("selected");
        else if (peer(state.sel, i)) btn.classList.add("peer");
        if (selected && state.grid[i] === selected && state.sel !== i) btn.classList.add("same");
        if (conflict(state.grid, i) && !state.given[i]) btn.classList.add("conflict");
        const value = state.grid[i];
        if (value) btn.textContent = String(value);
        else if (state.notes[i].length) {
          const box = document.createElement("span");
          box.className = "notes";
          for (let n = 1; n <= 9; n++) {
            const s = document.createElement("span");
            s.textContent = state.notes[i].includes(n) ? String(n) : "";
            box.appendChild(s);
          }
          btn.appendChild(box);
        }
        btn.addEventListener("click", () => { state.sel = i; render(); });
        $("board").appendChild(btn);
      }
      $("notes").classList.toggle("on", state.notesMode);
      $("hint").textContent = "تلميح " + state.hintsLeft;
      $("hint").disabled = state.hintsLeft <= 0;
      $("pause").textContent = state.running ? "إيقاف" : "متابعة";
      $("status").textContent = state.message;
      $("status").className = "note" + (state.tone ? " " + state.tone : "");
      $("win").classList.toggle("show", state.done && state.showWin);
      $("win-time").textContent = clock(state.elapsed);
      $("win-copy").textContent = state.mode === "daily" ? "لغز اليوم مكتمل." : "لغز نظيف، بلا استعراض.";
      persist();
    }
    function start(mode, level) {
      $("veil").classList.add("show");
      setTimeout(() => {
        state = fresh(mode, level);
        state.showWin = false;
        $("veil").classList.remove("show");
        render();
      }, 30);
    }
    function place(v) {
      if (!state || state.done || state.sel < 0 || state.given[state.sel]) return;
      if (state.notesMode) {
        if (state.grid[state.sel]) return;
        const bag = new Set(state.notes[state.sel]);
        bag.has(v) ? bag.delete(v) : bag.add(v);
        state.notes[state.sel] = [...bag].sort((a, b) => a - b);
        state.message = ""; state.tone = "";
        render();
        return;
      }
      state.grid[state.sel] = state.grid[state.sel] === v ? 0 : v;
      state.notes[state.sel] = [];
      const solved = state.grid.every((cell, i) => cell === state.solution[i]);
      state.done = solved;
      state.showWin = solved;
      if (solved) { state.running = false; remember(); }
      state.message = solved ? "اكتمل اللغز." : "";
      state.tone = solved ? "ok" : "";
      render();
    }
    function tick() {
      if (state?.running && !state.done) { state.elapsed += 1; $("clock").textContent = clock(state.elapsed); persist(); }
    }
    $("date").textContent = new Intl.DateTimeFormat("ar-EG", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
    LEVELS.forEach((level) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.level = level.id;
      btn.textContent = level.label;
      btn.addEventListener("click", () => start("free", level.id));
      $("levels").appendChild(btn);
    });
    for (let n = 1; n <= 9; n++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "digit";
      btn.textContent = String(n);
      btn.addEventListener("click", () => place(n));
      $("digits").appendChild(btn);
    }
    $("mode-free").onclick = () => start("free", state?.level || "mid");
    $("mode-daily").onclick = () => start("daily", "mid");
    $("notes").onclick = () => { state.notesMode = !state.notesMode; render(); };
    $("erase").onclick = () => {
      if (state.sel < 0 || state.given[state.sel] || state.done) return;
      state.grid[state.sel] = 0; state.notes[state.sel] = []; state.message = ""; state.tone = ""; render();
    };
    $("hint").onclick = () => {
      if (!state || state.done || state.hintsLeft <= 0) return;
      const open = [];
      for (let i = 0; i < 81; i++) if (state.grid[i] !== state.solution[i]) open.push(i);
      if (!open.length) return;
      const i = state.sel >= 0 && state.grid[state.sel] !== state.solution[state.sel] ? state.sel : open[Math.floor(Math.random() * open.length)];
      state.grid[i] = state.solution[i];
      state.given[i] = true;
      state.notes[i] = [];
      state.sel = i;
      state.hintsLeft -= 1;
      state.done = state.grid.every((cell, idx) => cell === state.solution[idx]);
      state.showWin = state.done;
      if (state.done) { state.running = false; remember(); }
      render();
    };
    $("check").onclick = () => {
      const wrong = state.grid.some((v, i) => v && !state.given[i] && v !== state.solution[i]);
      state.message = wrong ? "في أرقام لا تطابق الحل." : "ما كُتب حتى الآن صحيح.";
      state.tone = wrong ? "bad" : "ok";
      render();
    };
    $("pause").onclick = () => { if (!state.done) { state.running = !state.running; render(); } };
    $("again").onclick = () => start(state.mode, state.level);
    $("win-close").onclick = () => { state.showWin = false; render(); };
    $("win-next").onclick = () => start(state.mode, state.level);
    document.addEventListener("keydown", (event) => {
      if (!state) return;
      if (event.key >= "1" && event.key <= "9") place(Number(event.key));
      if (event.key === "Backspace" || event.key === "Delete") $("erase").click();
    });
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
    });
    $("install-btn").onclick = async () => {
      if (window.matchMedia("(display-mode: standalone)").matches) return;
      if (deferredPrompt) { await deferredPrompt.prompt(); deferredPrompt = null; return; }
      const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      alert(ios
        ? "من Safari: زر المشاركة، ثم إضافة إلى الشاشة الرئيسية."
        : "من كروم: النقاط الثلاث، ثم تثبيت التطبيق. افتح الرابط في كروم وليس من واتساب.");
    };
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE) || "null");
      if (saved?.solution?.length === 81 && !(saved.mode === "daily" && saved.day !== daySeed())) state = saved;
    } catch {}
    if (!state) state = fresh("free", "mid");
    state.showWin = false;
    render();
    timer = setInterval(tick, 1000);
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (standalone) $("install").style.display = "none";
  </script>
</body>
</html>
